name: live-office
on:
  push:
    paths: ["live-office/**", ".github/workflows/live-office.yml"]
  pull_request:
    paths: ["live-office/**"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: live-office/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: live-office/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run build
